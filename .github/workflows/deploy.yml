name: Publish the research site
# Publishes the site. Runs from main only (main is admin-only), so the hub, design and
# scripts always come from main. Studies are pulled in from the `studies` branch, where
# Flávia pushes freely. Nothing is committed back to any branch.
on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Study change"]
    types: [completed]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Get the latest studies
        run: git fetch --depth 1 origin studies:refs/remotes/origin/studies || echo "no studies branch yet"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and check
        run: |
          python scripts/merge_studies.py
          python scripts/build_hub.py
          python scripts/chrome.py
          python scripts/video.py
          python scripts/absolute_links.py
          python scripts/check.py
      - name: Leave the study kit and notes out of the public site
        run: rm -rf kit work PLAYBOOK.md CLAUDE.md README.md
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
