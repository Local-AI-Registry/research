name: Build research hub
on:
  push:
    branches: [main]
    paths: ["studies.json", "scripts/build_hub.py", "local-answer-gap/index.html"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build index.html from studies.json
        run: python scripts/build_hub.py
      - name: Commit the rebuilt hub
        run: |
          if git diff --quiet index.html; then echo "No changes"; exit 0; fi
          git config user.name "research-hub-bot"
          git config user.email "research-hub-bot@users.noreply.github.com"
          git add index.html
          git commit -m "Rebuild research hub from studies.json"
          git push
