<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 596" width="1000" height="596" role="img" aria-labelledby="t d"><title id="t">Why more searches give a steadier signal</title><desc id="d">Animation: two coin-flip lines draw across; with a handful of flips the share of heads jumps wildly, with thousands of flips it settles near 50 percent</desc><rect width="1000" height="596" fill="#FBF9F4"/><text x="40.0" y="46.0" font-family="'Bricolage Grotesque',Arial,sans-serif" font-size="15" font-weight="800" fill="#1F4FE0" text-anchor="start" letter-spacing="1.6">EXPLAINER: THE IDEA IN PLAIN WORDS</text><text x="40.0" y="90.0" font-family="'Bricolage Grotesque',Arial,sans-serif" font-size="30" font-weight="700" fill="#0B1A2E" text-anchor="start" >Why more searches give a steadier signal</text><g transform="translate(0,116)"><style>.draw{stroke-dasharray:100;animation:d 6s ease-in-out infinite}@keyframes d{0%{stroke-dashoffset:100}45%,100%{stroke-dashoffset:0}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect x="40" y="0" width="430" height="330" rx="16" fill="#FBF9F4" stroke="#D8D2C3" stroke-width="1.5"/><text x="255.0" y="40.0" font-family="'Bricolage Grotesque',Arial,sans-serif" font-size="22" font-weight="800" fill="#0B1A2E" text-anchor="middle" >A handful of coin flips</text><text x="255.0" y="66.0" font-family="'Hanken Grotesk',Arial,sans-serif" font-size="16" font-weight="400" fill="#4A5A72" text-anchor="middle" >Share of heads jumps all over</text><line x1="70" x2="440" y1="195" y2="195" stroke="#0B1A2E" stroke-opacity=".35" stroke-dasharray="5 5"/><text x="444.0" y="200.0" font-family="'Hanken Grotesk',Arial,sans-serif" font-size="14" font-weight="400" fill="#4A5A72" text-anchor="start" >50%</text><polyline class="draw" pathLength="100" points="74,100 99,195 124,132 149,242 174,157 199,252 224,119 249,214 274,148 299,262 324,176 349,128 374,233 399,166 424,204" fill="none" stroke="#FF5A3C" stroke-width="5" stroke-linejoin="round"/><rect x="530" y="0" width="430" height="330" rx="16" fill="#FBF9F4" stroke="#D8D2C3" stroke-width="1.5"/><text x="745.0" y="40.0" font-family="'Bricolage Grotesque',Arial,sans-serif" font-size="22" font-weight="800" fill="#0B1A2E" text-anchor="middle" >Thousands of coin flips</text><text x="745.0" y="66.0" font-family="'Hanken Grotesk',Arial,sans-serif" font-size="16" font-weight="400" fill="#4A5A72" text-anchor="middle" >Share of heads settles near 50%</text><line x1="560" x2="930" y1="195" y2="195" stroke="#0B1A2E" stroke-opacity=".35" stroke-dasharray="5 5"/><text x="934.0" y="200.0" font-family="'Hanken Grotesk',Arial,sans-serif" font-size="14" font-weight="400" fill="#4A5A72" text-anchor="start" >50%</text><polyline class="draw" pathLength="100" points="564,193 589,194 614,195 639,195 664,194 689,194 714,194 739,194 764,194 789,194 814,194 839,194 864,194 889,194 914,194" fill="none" stroke="#1F4FE0" stroke-width="5" stroke-linejoin="round"/><text x="500.0" y="372.0" font-family="'Hanken Grotesk',Arial,sans-serif" font-size="17" font-weight="700" fill="#0B1A2E" text-anchor="middle" >Searches work the same way. A brand with few searches gives a jumpy line;</text><text x="500.0" y="398.0" font-family="'Hanken Grotesk',Arial,sans-serif" font-size="17" font-weight="700" fill="#0B1A2E" text-anchor="middle" >a brand with millions gives a steady one you can read.</text></g><line x1="40" x2="960" y1="530" y2="530" stroke="#D8D2C3"/><text x="40.0" y="556.0" font-family="'Hanken Grotesk',Arial,sans-serif" font-size="15" font-weight="400" fill="#4A5A72" text-anchor="start" >Local AI Registry explainer</text><text x="960.0" y="580.0" font-family="'Hanken Grotesk',Arial,sans-serif" font-size="15" font-weight="700" fill="#1F4FE0" text-anchor="end" >Local AI Registry · localairegistry.com/research</text></svg>