<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 591" width="1000" height="591" role="img" aria-labelledby="t d"><title id="t">A real signal matches the ups and downs, not just the long trend</title><desc id="d">Two panels: left, two lines drifting in opposite directions labeled trend only (Equinox); right, two lines rising and falling together labeled real signal (Sephora)</desc><rect width="1000" height="591" fill="#FBF9F4"/><text x="40.0" y="46.0" font-family="'Bricolage Grotesque',Arial,sans-serif" font-size="15" font-weight="800" fill="#1F4FE0" text-anchor="start" letter-spacing="1.6">EXPLAINER</text><text x="40.0" y="90.0" font-family="'Bricolage Grotesque',Arial,sans-serif" font-size="30" font-weight="700" fill="#0B1A2E" text-anchor="start" >A real signal matches the ups and downs, not just the</text><text x="40.0" y="125.4" font-family="'Bricolage Grotesque',Arial,sans-serif" font-size="30" font-weight="700" fill="#0B1A2E" text-anchor="start" >long trend</text><g transform="translate(0,151)"><rect x="40" y="10" width="430" height="300" rx="14" fill="#FBF9F4" stroke="#D8D2C3" stroke-width="2"/><text x="255.0" y="50.0" font-family="'Bricolage Grotesque',Arial,sans-serif" font-size="24" font-weight="800" fill="#0B1A2E" text-anchor="middle" >Trend only</text><text x="255.0" y="80.0" font-family="'Hanken Grotesk',Arial,sans-serif" font-size="16" font-weight="400" fill="#4A5A72" text-anchor="middle" >Two slow drifts, no shared ups and downs</text><polyline points="70,250 111,230 152,240 193,210 234,215 276,190 317,195 358,170 399,175 440,150" fill="none" stroke="#0B1A2E" stroke-width="4" /><polyline points="70,120 111,150 152,130 193,160 234,140 276,180 317,155 358,190 399,170 440,210" fill="none" stroke="#FF5A3C" stroke-width="4" /><text x="255.0" y="340.0" font-family="'Hanken Grotesk',Arial,sans-serif" font-size="17" font-weight="700" fill="#0B1A2E" text-anchor="middle" >Equinox vs. Jeuveau: −0.78 trend, 0.02 changes</text><rect x="530" y="10" width="4