<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 596" width="1000" height="596" role="img" aria-labelledby="t d"><title id="t">How a hidden third factor fakes a link</title><desc id="d">Animation: summer pushes up both ice cream sales and sunburns; below, city life and income push up both med spa searches and Tesla searches</desc><rect width="1000" height="596" fill="#FBF9F4"/><text x="40.0" y="46.0" font-family="'Bricolage Grotesque',Arial,sans-serif" font-size="15" font-weight="800" fill="#1F4FE0" text-anchor="start" letter-spacing="1.6">EXPLAINER: THE IDEA IN PLAIN WORDS</text><text x="40.0" y="90.0" font-family="'Bricolage Grotesque',Arial,sans-serif" font-size="30" font-weight="700" fill="#0B1A2E" text-anchor="start" >How a hidden third factor fakes a link</text><g transform="translate(0,116)"><style>.bar{animation:g 5s ease-in-out infinite}@keyframes g{0%{transform:scaleX(.15)}50%,100%{transform:scaleX(1)}}.flow{animation:f 1.2s linear infinite}@keyframes f{to{stroke-dashoffset:-26}}.sun{animation:p 5s ease-in-out infinite;transform-origin:500px 200px}@keyframes p{0%,100%{opacity:.6}50%{opacity:1}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><text x="500.0" y="20.0" font-family="'Hanken Grotesk',Arial,sans-serif" font-size="18" font-weight="800" fill="#0B1A2E" text-anchor="middle" >Summer drives both. Ice cream doesn&#x27;t cause sunburns.</text><g class="sun"><circle cx="500" cy="100" r="44" fill="#E7EDFC" stroke="#FF5A3C" stroke-width="3"/></g><text x="500.0" y="106.0" font-family="'Hanken Grotesk',Arial,sans-serif" font-size="17" font-weight="800" fill="#FF5A3C" text-anchor="middle" >Summer</text><path d="M455 100 L275 100" stroke="#FF5A3C" stroke-width="3" stroke-dasharray="7 6" class="flow"/><rect x="90" y="66" width="180" height="68" rx="16" fill="#FBF9F4" stroke="#D8D2C3" stroke-width="1.5"/><text x="180.0" y="106.0" font-family="'Hanken Grotesk',Arial,sans-serif" font-size="17" font-weight="700" fill="#0B1A2E" text-anchor="middle" >Ice cream sales</text><rect class="bar" x="110" y="140" width="140" height="10" rx="5" fill="#FF5A3C" style="transform-origin:110px 145px"/><path d="M545 100 L725 100" stroke="#FF5A3C" stroke-width="3" stroke-dasharray="7 6" class="flow"/><rect x="730" y="66" width="180" height="68" rx="16" fill="#FBF9F4" stroke="#D8D2C3" stroke-width="1.5"/><text x="820.0" y="106.0" font-family="'Hanken Grotesk',Arial,sans-serif" font-size="17" font-weight="700" fill="#0B1A2E" text-anchor="middle" >Sunburns</text><rect class="bar" x="750" y="140" width="140" height="10" rx="5" fill="#FF5A3C" style="transform-origin:750px 145px"/><text x="500.0" y="210.0" font-family="'Hanken Grotesk',Arial,sans-serif" font-size="18" font-weight="800" fill="#0B1A2E" text-anchor="middle" >In this study: city life and income drive both.</text><g class="sun"><circle cx="500" cy="290" r="44" fill="#E7EDFC" stroke="#1F4FE0" stroke-width="3"/></g><text x="500.0" y="296.0" font-family="'Hanken Grotesk',Arial,sans-serif" font-size="17" font-weight="800" fill="#1F4FE0" text-anchor="middle" >City life</text><path d="M455 290 L275 290" stroke="#1F4FE0" stroke-width="3" stroke-dasharray="7 6" class="flow"/><rect x="90" y="256" width="180" height="68" rx="16" fill="#FBF9F4" stroke="#D8D2C3" stroke-width="1.5"/><text x="180.0" y="296.0" font-family="'Hanken Grotesk',Arial,sans-serif" font-size="17" font-weight="700" fill="#0B1A2E" text-anchor="middle" >Med spa searches</text><rect class="bar" x="110" y="330" width="140" height="10" rx="5" fill="#1F4FE0" style="transform-origin:110px 335px"/><path d="M545 290 L725 290" stroke="#1F4FE0" stroke-width="3" stroke-dasharray="7 6" class="flow"/><rect x="730" y="256" width="180" height="68" rx="16" fill="#FBF9F4" stroke="#D8D2C3" stroke-width="1.5"/><text x="820.0" y="296.0" font-family="'Hanken Grotesk',Arial,sans-serif" font-size="17" font-weight="700" fill="#0B1A2E" text-anchor="middle" >Tesla searches</text><rect class="bar" x="750" y="330" width="140" height="10" rx="5" fill="#1F4FE0" style="transform-origin:750px 335px"/><text x="500.0" y="395.0" font-family="'Hanken Grotesk',Arial,sans-serif" font-size="17" font-weight="700" fill="#4A5A72" text-anchor="middle" >When two searches match, ask what else could push both up.</text></g><line x1="40" x2="960" y1="530" y2="530" stroke="#D8D2C3"/><text x="40.0" y="556.0" font-family="'Hanken Grotesk',Arial,sans-serif" font-size="15" font-weight="400" fill="#4A5A72" text-anchor="start" >Local AI Registry explainer</text><text x="960.0" y="580.0" font-family="'Hanken Grotesk',Arial,sans-serif" font-size="15" font-weight="700" fill="#1F4FE0" text-anchor="end" >Local AI Registry · localairegistry.com/research</text></svg>