" fill="#0B1A2E" text-anchor="middle" >Dec</text><line x1="680" x2="680" y1="190" y2="210" stroke="#0B1A2E" stroke-width="2"/><text x="680.0" y="238.0" font-family="'Bricolage Grotesque',Arial,sans-serif" font-size="18" font-weight="700" fill="#0B1A2E" text-anchor="middle" >Jan</text><line x1="870" x2="870" y1="190" y2="210" stroke="#0B1A2E" stroke-width="2"/><text x="870.0" y="238.0" font-family="'Bricolage Grotesque',Arial,sans-serif" font-size="18" font-weight="700" fill="#0B1A2E" text-anchor="middle" >Feb</text><rect x="110" y="150" width="570" height="28" rx="8" fill="#ECE6D6" stroke="#D8D2C3"/><text x="395.0" y="170.0" font-family="'Hanken Grotesk',Arial,sans-serif" font-size="16" font-weight="700" fill="#4A5A72" text-anchor="middle" >The quarter (Oct to Dec)</text><circle class="wk" style="animation-delay:0.00s" cx="122" cy="120" r="9" fill="#1F4FE0"/><circle class="wk" style="animation-delay:0.32s" cx="166" cy="120" r="9" fill="#1F4FE0"/><circle class="wk" style="animation-delay:0.64s" cx="210" cy="120" r="9" fill="#1F4FE0"/><circle class="wk" style="animation-delay:0.96s" cx="254" cy="120" r="9" fill="#1F4FE0"/><circle class="wk" style="animation-delay:1.28s" cx="297" cy="120" r="9" fill="#1F4FE0"/><circle class="wk" style="animation-delay:1.60s" cx="341" cy="120" r="9" fill="#1F4FE0"/><circle class="wk" style="animation-delay:1.92s" cx="385" cy="120" r="9" fill="#1F4FE0"/><circle class="wk" style="animation-delay:2.24s" cx="429" cy="120" r="9" fill="#1F4FE0"/><circle class="wk" style="animation-delay:2.56s" cx="473" cy="120" r="9" fill="#1F4FE0"/><circle class="wk" style="animation-delay:2.88s" cx="517" cy="120" r="9" fill="#1F4FE0"/><circle class="wk" style="animation-delay:3.20s" cx="560" cy="120" r="9" fill="#1F4FE0"/><circle class="wk" style="animation-delay:3.52s" cx="604" cy="120" r="9" fill="#1F4FE0"/><circle class="wk" style="animation-delay:3.84s" cx="648" cy="120" r="9" fill="#1F4FE0"/><text x="110.0" y="96.0" font-family="'Hanken Grotesk',Arial,sans-serif" font-size="17" font-weight="700" fill="#1F4FE0" text-anchor="start" >Search data arrives every week</text><g class="est"><line x1="380" x2="380" y1="104" y2="300" stroke="#FF5A3C" stroke-width="4"/><text x="380.0" y="326.0" font-family="'Hanken Grotesk',Arial,sans-serif" font-size="18" font-weight="800" fill="#FF5A3C" text-anchor="middle" >Our early read</text><text x="380.0" y="350.0" font-family="'Hanken Grotesk',Arial,sans-serif" font-size="16" font-weight="400" fill="#4A5A72" text-anchor="middle" >mid-November</text></g><g class="rep"><path d="M720 300 L720 260 L790 272 L720 284" fill="#0B1A2E"/><text x="720.0" y="326.0" font-family="'Hanken Grotesk',Arial,sans-serif" font-size="18" font-weight="800" fill="#0B1A2E" text-anchor="middle" >Company reports</text><text x="720.0" y="350.0" font-family="'Hanken Grotesk',Arial,sans-serif" font-size="16" font-weight="400" fill="#4A5A72" text-anchor="middle" >January or later</text></g><text x="500.0" y="396.0" font-family="'Hanken Grotesk',Arial,sans-serif" font-size="16" font-weight="700" fill="#0B1A2E" text-anchor="middle" >A nowcast is a reading of a quarter while it is still happening, like checking the radar instead of waiting for the news.</text></g><line x1="40" x2="960" y1="530" y2="530" stroke="#D8D2C3"/><text x="40.0" y="556.0" font-family="'Hanken Grotesk',Arial,sans-serif" font-size="15" font-weight="400" fill="#4A5A72" text-anchor="start" >Local AI Registry explainer</text><text x="960.0" y="580.0" font-family="'Hanken Grotesk',Arial,sans-serif" font-size="15" font-weight="700" fill="#1F4FE0" text-anchor="end" >Local AI Registry · localairegistry.com/research</text></svg>