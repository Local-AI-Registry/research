<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 626" width="1000" height="626" role="img" aria-labelledby="t d"><title id="t">What does a “0.71 match” mean?</title><desc id="d">Animation: two lines; the second line changes from moving randomly (0, no link) to mostly following the first (0.7, a strong link) to matching it exactly (1.0, a perfect link)</desc><rect width="1000" height="626" fill="#FBF9F4"/><text x="40.0" y="46.0" font-family="'Bricolage Grotesque',Arial,sans-serif" font-size="15" font-weight="800" fill="#1F4FE0" text-anchor="start" letter-spacing="1.6">EXPLAINER: THE IDEA IN PLAIN WORDS</text><text x="40.0" y="90.0" font-family="'Bricolage Grotesque',Arial,sans-serif" font-size="30" font-weight="700" fill="#0B1A2E" text-anchor="start" >What does a “0.71 match” mean?</text><g transform="translate(0,116)"><style>.v0,.v1,.v2{opacity:0;animation:cyc 9s infinite}.v1{opacity:1}.v0{animation-name:c0}.v1{animation-name:c1}.v2{animation-name:c2}@keyframes c0{0%,28%{opacity:1}33%,100%{opacity:0}}@keyframes c1{0%,30%{opacity:0}36%,61%{opacity:1}66%,100%{opacity:0}}@keyframes c2{0%,63%{opacity:0}69%,97%{opacity:1}100%{opacity:0}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><polyline points="120,260 205,225 290,245 375,205 460,230 545,190 630,215 715,180 800,200 885,165" fill="none" stroke="#0B1A2E" stroke-width="5" stroke-linejoin="round"/><polyline class="v0" points="120,239 205,251 290,224 375,246 460,254 545,224 630,177 715,188 800,191 885,240" fill="none" stroke="#FF5A3C" stroke-width="5" stroke-linejoin="round"/><polyline class="v1" points="120,243 205,203 290,235 375,185 460,206 545,180 630,226 715,186 800,205 885,148" fill="none" stroke="#FF5A3C" stroke-width="5" stroke-linejoin="round"/><polyline class="v2" points="120,252 205,217 290,237 375,197 460,222 545,182 630,207 715,172 800,192 885,157" fill="none" stroke="#FF5A3C" stroke-width="5" stroke-linejoin="round"/><g class="v0"><text x="500.0" y="352.0" font-family="'Bricolage Grotesque',Arial,sans-serif" font-size="30" font-weight="800" fill="#FF5A3C" text-anchor="middle" >0 = no link</text><text x="500.0" y="386.0" font-family="'Hanken Grotesk',Arial,sans-serif" font-size="18" font-weight="400" fill="#4A5A72" text-anchor="middle" >The two lines go their own way</text></g><g class="v1"><text x="500.0" y="352.0" font-family="'Bricolage Grotesque',Arial,sans-serif" font-size="30" font-weight="800" fill="#FF5A3C" text-anchor="middle" >0.7 = a strong link</text><text x="500.0" y="386.0" font-family="'Hanken Grotesk',Arial,sans-serif" font-size="18" font-weight="400" fill="#4A5A72" text-anchor="middle" >Mostly up and down together, like Sephora and Jeuveau</text></g><g class="v2"><text x="500.0" y="352.0" font-family="'Bricolage Grotesque',Arial,sans-serif" font-size="30" font-weight="800" fill="#FF5A3C" text-anchor="middle" >1.0 = a perfect link</text><text x="500.0" y="386.0" font-family="'Hanken Grotesk',Arial,sans-serif" font-size="18" font-weight="400" fill="#4A5A72" text-anchor="middle" >They move as one</text></g><rect x="120" y="16" width="26" height="6" fill="#0B1A2E"/><text x="154.0" y="26.0" font-family="'Hanken Grotesk',Arial,sans-serif" font-size="16" font-weight="400" fill="#4A5A72" text-anchor="start" >Thing one</text><rect x="270" y="16" width="26" height="6" fill="#FF5A3C"/><text x="304.0" y="26.0" font-family="'Hanken Grotesk',Arial,sans-serif" font-size="16" font-weight="400" fill="#4A5A72" text-anchor="start" >Thing two</text><text x="500.0" y="430.0" font-family="'Hanken Grotesk',Arial,sans-serif" font-size="17" font-weight="700" fill="#0B1A2E" text-anchor="middle" >A minus sign means they move in opposite directions.</text></g><line x1="40" x2="960" y1="560" y2="560" stroke="#D8D2C3"/><text x="40.0" y="586.0" font-family="'Hanken Grotesk',Arial,sans-serif" font-size="15" font-weight="400" fill="#4A5A72" text-anchor="start" >Local AI Registry explainer</text><text x="960.0" y="610.0" font-family="'Hanken Grotesk',Arial,sans-serif" font-size="15" font-weight="700" fill="#1F4FE0" text-anchor="end" >Local AI Registry · localairegistry.com/research</text></svg>