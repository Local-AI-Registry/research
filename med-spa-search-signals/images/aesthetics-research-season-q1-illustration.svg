<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 481" width="1000" height="481" role="img" aria-labelledby="t d"><title id="t">January to March is when clients research; spring is when they book</title><desc id="d">Timeline of four quarters: January to March searching, April to June booking, July to September quieter, October to December holiday push</desc><rect width="1000" height="481" fill="#FBF9F4"/><text x="40.0" y="46.0" font-family="'Bricolage Grotesque',Arial,sans-serif" font-size="15" font-weight="800" fill="#1F4FE0" text-anchor="start" letter-spacing="1.6">EXPLAINER</text><text x="40.0" y="90.0" font-family="'Bricolage Grotesque',Arial,sans-serif" font-size="30" font-weight="700" fill="#0B1A2E" text-anchor="start" >January to March is when clients research; spring is when</text><text x="40.0" y="125.4" font-family="'Bricolage Grotesque',Arial,sans-serif" font-size="30" font-weight="700" fill="#0B1A2E" text-anchor="start" >they book</text><g transform="translate(0,151)"><rect x="40" y="40" width="215" height="150" rx="14" fill="#E7EDFC" stroke="#1F4FE0" stroke-width="2"/><text x="147.0" y="92.0" font-family="'Bricolage Grotesque',Arial,sans-serif" font-size="22" font-weight="800" fill="#0B1A2E" text-anchor="middle" >Jan to Mar</text><text x="147.0" y="132.0" font-family="'Hanken Grotesk',Arial,sans-serif" font-size="20" font-weight="700" fill="#1F4FE0" text-anchor="middle" >Searching</text><line x1="258" y1="115" x2="272" y2="115" stroke="#0B1A2E" stroke-opacity="0.5" stroke-width="3"/><polygon points="272,115 259.4,121.1 259.4,108.9" fill="#0B1A2E" fill-opacity="0.5"/><rect x="275" y="40" width="215" height="150" rx="14" fill="#FBF9F4" stroke="#D8D2C3" stroke-width="2"/><text x="382.0" y="92.0" font-family="'Bricolage Grotesque',Arial,sans-serif" font-size="22" font-weight="800" fill="#0B1A2E" text-anchor="middle" >Apr to Jun</text><text x="382.0" y="132.0" font-family="'Hanken Grotesk',Arial,sans-serif" font-size="20" font-weight="700" fill="#FF5