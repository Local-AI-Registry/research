<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 876" width="720" height="876" role="img" aria-labelledby="f1d-t f1d-d" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif"><title id="f1d-t">Figure 1. Repeating a query changes the result</title><desc id="f1d-d">Split bars showing the overlap between two runs of the same query (returned in both runs divided by returned in either). Panel A, peer-reviewed (Grossman et al., SIGIR 2026), sources retrieved for general queries: Google Search 0.78, Google AI Overviews 0.66, Gemini 0.46. Panel B, preprint (Pitenin 2026, vendor-funded), local venues recommended in Bali: Gemini 0.45, Perplexity 0.40, OpenAI 0.29, Claude 0.22. The panels are separate studies and are not directly comparable.</desc><style>@font-face{font-family:'Hanken Grotesk';src:url(https://localairegistry.com/research/assets/fonts/hanken-grotesk.woff2) format('woff2');font-weight:400 700}@font-face{font-family:'Bricolage Grotesque';src:url(https://localairegistry.com/research/assets/fonts/bricolage-grotesque.woff2) format('woff2');font-weight:600 800}</style><rect x="0" y="0" width="720" height="876" rx="18" fill="#FFFFFF"/><defs><pattern id="f1d-hb" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="6" stroke="#1F4FE0" stroke-width="1.6" stroke-opacity="0.38"/></pattern><pattern id="f1d-hi" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="6" stroke="#0B1A2E" stroke-width="1.6" stroke-opacity="0.38"/></pattern></defs><text x="32.0" y="38.0" font-family="'Bricolage Grotesque', 'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#566174" text-anchor="start" letter-spacing="1.4">FIGURE 1</text><text x="32.0" y="66.0" font-family="'Bricolage Grotesque', 'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="23" font-weight="700" fill="#0B1A2E" text-anchor="start">Repeating a query changes the result</text><text x="32.0" y="97.0" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="400" fill="#566174" text-anchor="start">How much of what a system returns stays the same when the same query is run twice. Each</text><text x="32.0" y="116.9" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="400" fill="#566174" text-anchor="start">bar is everything returned across both runs; the solid part was returned both times.</text><rect x="32" y="158.76" width="656" height="88.0" rx="14" fill="#F6F3EC"/><defs><clipPath id="f1d-vc"><circle cx="71.0" cy="201.76" r="24"/></clipPath></defs><circle cx="97.0" cy="201.76" r="24" fill="#1F4FE0" clip-path="url(#f1d-vc)"/><circle cx="71.0" cy="201.76" r="24" fill="none" stroke="#0B1A2E" stroke-width="1.6"/><circle cx="97.0" cy="201.76" r="24" fill="none" stroke="#0B1A2E" stroke-width="1.6"/><text x="60.2" y="205.8" font-family="'Bricolage Grotesque', 'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#0B1A2E" text-anchor="middle">1</text><text x="107.8" y="205.8" font-family="'Bricolage Grotesque', 'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#0B1A2E" text-anchor="middle">2</text><text x="60.0" y="238.8" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10.5" font-weight="600" fill="#566174" text-anchor="middle">Run 1</text><text x="110.0" y="238.8" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10.5" font-weight="600" fill="#566174" text-anchor="middle">Run 2</text><text x="144.0" y="188.8" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13.5" font-weight="700" fill="#0B1A2E" text-anchor="start">Overlap = returned in both runs ÷ returned in either run</text><text x="144.0" y="207.8" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#566174" text-anchor="start">(Jaccard similarity: 1 means identical, 0 means nothing in common)</text><rect x="144" y="223.76" width="22" height="10" rx="3" fill="#1F4FE0"/><text x="172.0" y="232.8" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11.5" font-weight="600" fill="#0B1A2E" text-anchor="start">In both runs</text><rect x="266" y="223.76" width="22" height="10" rx="3" fill="url(#f1d-hb)" stroke="#1F4FE0" stroke-opacity=".35"/><text x="294.0" y="232.8" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11.5" font-weight="600" fill="#0B1A2E" text-anchor="start">In one run only</text><rect x="32" y="264.76" width="656" height="214.02499999999998" rx="14" fill="#FFFFFF" stroke="#E2DDD2"/><rect x="32" y="278.76" width="4" height="186.02499999999998" rx="2" fill="#1F4FE0"/><text x="48.0" y="294.8" font-family="'Bricolage Grotesque', 'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="800" fill="#1F4FE0" text-anchor="start">A</text><text x="68.0" y="294.8" font-family="'Bricolage Grotesque', 'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.5" font-weight="700" fill="#0B1A2E" text-anchor="start">Sources each system retrieved</text><rect x="551.7" y="278.8" width="120" height="21" rx="10.5" fill="#FFFFFF" stroke="#0B1A2E" stroke-width="1"/><circle cx="562.7" cy="289.3" r="3.2" fill="#0B1A2E"/><text x="571.7" y="293.4" font-family="'Bricolage Grotesque', 'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="700" fill="#0B1A2E" text-ancho