<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 1357" width="360" height="1357" role="img" aria-labelledby="f1m-t f1m-d" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif"><title id="f1m-t">Figure 1. Repeating a query changes the result</title><desc id="f1m-d">Split bars showing the overlap between two runs of the same query (returned in both runs divided by returned in either). Panel A, peer-reviewed (Grossman et al., SIGIR 2026), sources retrieved for general queries: Google Search 0.78, Google AI Overviews 0.66, Gemini 0.46. Panel B, preprint (Pitenin 2026, vendor-funded), local venues recommended in Bali: Gemini 0.45, Perplexity 0.40, OpenAI 0.29, Claude 0.22. The panels are separate studies and are not directly comparable.</desc><style>@font-face{font-family:'Hanken Grotesk';src:url(https://localairegistry.com/research/assets/fonts/hanken-grotesk.woff2) format('woff2');font-weight:400 700}@font-face{font-family:'Bricolage Grotesque';src:url(https://localairegistry.com/research/assets/fonts/bricolage-grotesque.woff2) format('woff2');font-weight:600 800}</style><rect x="0" y="0" width="360" height="1357" rx="18" fill="#FFFFFF"/><defs><pattern id="f1m-hb" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="6" stroke="#1F4FE0" stroke-width="1.6" stroke-opacity="0.38"/></pattern><pattern id="f1m-hi" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="6" stroke="#0B1A2E" stroke-width="1.6" stroke-opacity="0.38"/></pattern></defs><text x="32.0" y="38.0" font-family="'Bricolage Grotesque', 'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#566174" text-anchor="start" letter-spacing="1.4">FIGURE 1</text><text x="32.0" y="66.0" font-family="'Bricolage Grotesque', 'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#0B1A2E" text-anchor="start">Repeating a query changes</text><text x="32.0" y="92.0" font-family="'Bricolage Grotesque', 'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#0B1A2E" text-anchor="start">the result</text><text x="32.0" y="120.0" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="400" fill="#566174" text-anchor="start">How much of what a system returns stays the</text><text x="32.0" y="138.5" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="400" fill="#566174" text-anchor="start">same when the same query is run twice. Each</text><text x="32.0" y="156.9" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="400" fill="#566174" text-anchor="start">bar is everything returned across both</text><text x="32.0" y="175.4" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="400" fill="#566174" text-anchor="start">runs; the solid part was returned both</text><text x="32.0" y="193.8" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="400" fill="#566174" text-anchor="start">times.</text><rect x="32" y="234.3" width="296" height="154.0" rx="14" fill="#F6F3EC"/><defs><clipPath id="f1m-vc"><circle cx="71.0" cy="277.3" r="24"/></clipPath></defs><circle cx="97.0" cy="277.3" r="24" fill="#1F4FE0" clip-path="url(#f1m-vc)"/><circle cx="71.0" cy="277.3" r="24" fill="none" stroke="#0B1A2E" stroke-width="1.6"/><circle cx="97.0" cy="277.3" r="24" fill="none" stroke="#0B1A2E" stroke-width="1.6"/><text x="60.2" y="281.3" font-family="'Bricolage Grotesque', 'Hanken Grotesk', ui-sans-serif, sys