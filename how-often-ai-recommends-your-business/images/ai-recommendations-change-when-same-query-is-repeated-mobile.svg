</text><rect x="48" y="365.3" width="22" height="10" rx="3" fill="#1F4FE0"/><text x="76.0" y="374.3" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11.5" font-weight="600" fill="#0B1A2E" text-anchor="start">In both runs</text><rect x="170" y="365.3" width="22" height="10" rx="3" fill="url(#f1m-hb)" stroke="#1F4FE0" stroke-opacity=".35"/><text x="198.0" y="374.3" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11.5" font-weight="600" fill="#0B1A2E" text-anchor="start">In one run only</text><rect x="32" y="406.3" width="296" height="357.2" rx="14" fill="#FFFFFF" stroke="#E2DDD2"/><rect x="32" y="420.3" width="4" height="329.2" rx="2" fill="#1F4FE0"/><text x="48.0" y="436.3" font-family="'Bricolage Grotesque', 'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="800" fill="#1F4FE0" text-anchor="start">A</text><text x="68.0" y="436.3" font-family="'Bricolage Grotesque', 'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.5" font-weight="700" fill="#0B1A2E" text-anchor="start">Sources each system</text><text x="68.0" y="455.3" font-family="'Bricolage Grotesque', 'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.5" font-weight="700" fill="#0B1A2E" text-anchor="start">retrieved</text><text x="68.0" y="475.3" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#566174" text-anchor="start">General web queries · 100 stratified</text><text x="68.0" y="490.8" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#566174" text-anchor="start">queries, each run twice, same device</text><text x="68.0" y="506.3" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="400