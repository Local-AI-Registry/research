<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 606" width="1000" height="606" role="img" aria-labelledby="t d"><title>How Google’s AI builds an answer about a local business</title><desc>For local questions, Google’s AI assembled answers mostly from news coverage (67.5% of citations), rarely from the business itself (6.5%), and usually ended by telling people to check with their local store. Source: Local AI Registry, https://research.localairegistry.com/local-answer-gap/ (CC BY 4.0)</desc><metadata><x:xmpmeta xmlns:x="adobe:ns:meta/"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#">
