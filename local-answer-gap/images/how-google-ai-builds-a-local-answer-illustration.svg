<dc:title><rdf:Alt><rdf:li xml:lang="x-default">How Google’s AI builds an answer about a local business</rdf:li></rdf:Alt></dc:title>
<dc:description><rdf:Alt><rdf:li xml:lang="x-default">For local questions, Google’s AI assembled answers mostly from news coverage (67.5% of citations), rarely from the business itself (6.5%), and usually ended by telling people to check with their local store.</rdf:li></rdf:Alt></dc:description>
