<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 377" width="1000" height="377" role="img" aria-labelledby="t d"><title>Ask the same thing in different words and two-thirds of the sources change</title><desc>“Is Target open on Easter” and “Target Easter hours,” asked the same day, shared about 35% of cited sources on average. The verdict stayed the same; the sources rotated. Source: Local AI Registry, https://research.localairegistry.com/local-answer-gap/ (CC BY 4.0)</desc><metadata><x:xmpmeta xmlns:x="adobe:ns:meta/"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#">
