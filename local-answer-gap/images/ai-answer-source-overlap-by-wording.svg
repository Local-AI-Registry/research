</rdf:Description></rdf:RDF></x:xmpmeta></metadata><title id="t">Ask the same thing in different words and two-thirds of the sources change</title><desc id="d">Jaccard</desc><rect width="1000" height="377" fill="#FBF9F4"/><text x="40.0" y="46.0" font-family="'Bricolage Grotesque',Arial,sans-serif" font-size="15" font-weight="800" fill="#1F4FE0" text-anchor="start" letter-spacing="1.6">FINDING 6</text><text x="40.0" y="90.0" font-family="'Bricolage Grotesque',Arial,sans-serif" font-size="30" font-weight="700" fill="#0B1A2E" text-anchor="start" >Ask the same thing in different words and two-thirds of the</text><text x="40.0" y="125.4" font-family="'Bricolage Grotesque',Arial,sans-serif" font-size="30" font-weight="700" fill="#0B1A2E" text-anchor="start" >sources change</text><g transform="translate(0,151)"><text x="346.0" y="33.0" font-family="'Hanken Grotesk',Arial,sans-serif" font-size="18" font-weight="400" fill="#0B1A2E" text-anchor="end" >Same local query, another day</text><rect x="360" y="10" width="370" height="32" fill="#ECE6D6" rx="2"/><rect x="360" y="10" width="225.7" height="32" fill="#1F4FE0" fill-opacity="0.75" rx="2"/><text x="742.0" y="33.0" font-family="'Hanken Grotesk',Arial,sans-serif" font-size="18" font-weight="700" fill="#0B1A2E" text-anchor="start" >61% shared  18 pairs</text><text x="346.0" y="77.0" font-family="'Hanken Grotesk',Arial,sans-serif" font-size="18" font-weight="700" fill="#0B1A2E" text-anchor="end" >Same brand, same day,</text><text x="346.0" y="96.0" font-family="'Hanken Grotesk',Arial,sans-serif" font-size="18" font-weight="700" fill="#0B1A2E" text-anchor="end" >different wording</text><rect x="360" y="62" width="370" height="32" fill="#ECE6D6" rx="2"/><rect x="360" y="62" width="130.6" height="32" fill="#1F4FE0" fill-opacity="1" rx="2"/><text x="742.0" y="85.0" font-family="'Hanken Grotesk',Arial,sans-serif" font-size="18" font-weight="700" fill="#0B1A2E" text-anchor="start" >35% shared  157 pairs</text><text x="346.0" y="137.0" font-family="'Hanken Grotesk',Arial,sans-serif" font-size="18" font-weight="400" fill="#0B1A2E" text-anchor="end" >Other topics, same query repeated</text><rect x="360" y="114" width="370" height="32" fill="#ECE6D6" rx="2"/><rect x="360" y="114" width="143.9" height="32" fill="#4A5A72" fill-opacity="0.45" rx="2"/><text x="742.0" y="137.0" font-family="'Hanken Grotesk',Arial,sans-serif" font-size="18" font-weight="700" fill="#0B1A2E" text-anchor="start" >39% shared  3,294 pairs</text></g><line x1="40" x2="960" y1="311" y2="311" stroke="#D8D2C3"/><text x="40.0" y="337.0" font-family="'Hanken Grotesk',Arial,sans-serif" font-size="15" font-weight="400" fill="#4A5A72" text-anchor="start" >Data: Local AI Registry analysis of the IMC 2026 Google AI Overviews dataset (CC BY 4.0)</text><text x="960.0" y="361.0" font-family="'Hanken Grotesk',Arial,sans-serif" font-size="15" font-weight="700" fill="#1F4FE0" text-anchor="end" >Local AI Registry · research.localairegistry.com</text></svg>