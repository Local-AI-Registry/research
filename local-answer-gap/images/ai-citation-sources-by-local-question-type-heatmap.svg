<dc:title><rdf:Alt><rdf:li xml:lang="x-default">The vaguer the local question, the less the business gets cited</rdf:li></rdf:Alt></dc:title>
<dc:description><rdf:Alt><rdf:li xml:lang="x-default">Businesses’ own sites made up 8.8 to 10.9% of citations when a brand was named, but only 1.0% for generic “what’s open” questions, which is how people discover new places.</rdf:li></rdf:Alt></dc:description>
