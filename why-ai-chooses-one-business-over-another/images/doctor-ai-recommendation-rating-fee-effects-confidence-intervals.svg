<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 785.0" width="1000" height="785.0" role="img" aria-labelledby="t d"><title id="t">Doctors: rating and fee had the largest effects among the levels tested</title><desc id="d">Horizontal bar chart of 8 non-name contrasts from the doctor experiment (Gillani and Baig, preprint), each with its published 95% confidence interval, in percentage points relative to the reference level. Rating 4.7 vs 3.9: +31.38; $190 vs $90 new-patient fee: -20.02; 400 vs 12 reviews: +8.44; review 3 days old vs 11 months: +3.80; telehealth: +2.78; responds to patient feedback note: +2.09; university-hospital affiliation: +0.34; listed 5th vs 1st: -6.15. The journal abstract reports +31.4, -20.0 and -6.2.</desc><rect width="1000" height="785.0" fill="#FBF9F4"/><text x="40.0" y="46.0" font-family="'Bricolage Grotesque',Arial,sans-serif" font-size="15" font-weight="800" fill="#1F4FE0" text-anchor="start" letter-spacing="1.6">DOCTOR EXPERIMENT · PREPRINT VALUES</text><text x="40.0" y="90.0" font-family="'Bricolage Grotesque',Arial,sans-serif" font-size="30" font-weight="700" fill="#0B1A2E" text-anchor="start" >Doctors: rating and fee had the largest effects among the</text><text x="40.0" y="125.4" font-family="'Bricolage Grotesque',Arial,sans-serif" font-size="30" font-weight="700" fill="#0B1A2E" text-anchor="start" >levels tested</text><g transform="translate(0,151)"><text x="40.0" y="6.0" font-family="'Hanken Grotesk',Arial,sans-serif" font-size="17" font-weight="400" fill="#4A5A72" text-anchor="start" >Average change in selection probability relative to the stated reference level, in percentage points.</text><text x="40.0" y="32.0" font-family="'Hanken Grotesk',Arial,sans-serif" font-size="17" font-weight="400" fill="#4A5A72" text-anchor="start" >Bars: estimate. Lines: published 95% confidence interval. Selection explained in the note below.</text><line x1="426.0" x2="426.0" y1="72" y2="402" stroke="#D8D2C3" stroke-width="1" stroke-dash