40.0" y="553.0" font-family="'Hanken Grotesk',Arial,sans-serif" font-size="15" font-weight="400" fill="#4A5A72" text-anchor="start" >shown. Same team as the hotel study; synthetic cards.</text></g><line x1="40" x2="960" y1="719.0" y2="719.0" stroke="#D8D2C3"/><text x="40.0" y="745.0" font-family="'Hanken Grotesk',Arial,sans-serif" font-size="15" font-weight="400" fill="#4A5A72" text-anchor="start" >Data: preprint estimates with published 95% confidence intervals</text><text x="960.0" y="769.0" font-family="'Hanken Grotesk',Arial,sans-serif" font-size="15" font-weight="700" fill="#1F4FE0" text-anchor="end" >Local AI Registry · localairegistry.com/research</text></svg>