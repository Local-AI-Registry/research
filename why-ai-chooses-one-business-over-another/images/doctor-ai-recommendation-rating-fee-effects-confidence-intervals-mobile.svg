Baig, arXiv 2608.14399 v1 (preprint),</text><text x="30.0" y="851.0" font-family="'Hanken Grotesk',Arial,sans-serif" font-size="19" font-weight="400" fill="#4A5A72" text-anchor="start" >pooled results. The journal abstract reports +31.4</text><text x="30.0" y="877.6" font-family="'Hanken Grotesk',Arial,sans-serif" font-size="19" font-weight="400" fill="#4A5A72" text-anchor="start" >(rating), -20.0 (fee) and -6.2 (listed last); the rest are</text><text x="30.0" y="904.2" font-family="'Hanken Grotesk',Arial,sans-serif" font-size="19" font-weight="400" fill="#4A5A72" text-anchor="start" >preprint values. Shown: the non-name attribute contrasts</text><text x="30.0" y="930.8" font-family="'Hanken Grotesk',Arial,sans-serif" font-size="19" font-weight="400" fill="#4A5A72" text-anchor="start" >recorded from the preprint; name-signal contrasts</text><text x="30.0" y="957.4" font-family="'Hanken Grotesk',Arial,sans-serif" font-size="19" font-weight="400" fill="#4A5A72" text-anchor="start" >(discussed in the text), the $140 fee level and years in</text><text x="30.0" y="984.0" font-family="'Hanken Grotesk',Arial,sans-serif" font-size="19" font-weight="400" fill="#4A5A72" text-anchor="start" >practice are not shown. Same team as the hotel study;</text><text x="30.0" y="1010.6" font-family="'Hanken Grotesk',Arial,sans-serif" font-size="19" font-weight="400" fill="#4A5A72" text-anchor="start" >synthetic cards.</text></g><line x1="30" x2="610" y1="1252.2" y2="1252.2" stroke="#D8D2C3"/><text x="610.0" y="1278.2" font-family="'Hanken Grotesk',Arial,sans-serif" font-size="18" font-weight="700" fill="#1F4FE0" text-anchor="end" >Local AI Registry · localairegistry.com/research</text></svg>