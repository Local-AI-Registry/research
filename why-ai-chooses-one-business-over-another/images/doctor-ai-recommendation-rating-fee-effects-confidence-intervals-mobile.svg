<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1296.2" width="640" height="1296.2" role="img" aria-labelledby="tm dm"><title id="tm">Doctors: rating and fee had the largest effects among the levels tested</title><desc id="dm">Horizontal bar chart of 8 non-name contrasts from the doctor experiment (Gillani and Baig, preprint), each with its published 95% confidence interval, in percentage points relative to the reference level. Rating 4.7 vs 3.9: +31.38; $190 vs $90 new-patient fee: -20.02; 400 vs 12 reviews: +8.44; review 3 days old vs 11 months: +3.80; telehealth: +2.78; responds to patient feedback note: +2.09; university-hospital affiliation: +0.34; listed 5th vs 1st: -6.15. The journal abstract reports +31.4, -20.0 and -6.2.</desc><rect width="640" height="1296.2" fill="#FBF9F4"/><text x="30.0" y="48.0" font-family="'Bricolage Grotesque',Arial,sans-serif" font-size="19" font-weight="800" fill="#1F4FE0" text-anchor="start" letter-spacing="1.4">DOCTOR EXPERIMENT · PREPRINT VALUES</text><text x="30.0" y="94.0" font-family="'Bricolage Grotesque',Arial,sans-serif" font-size="36" font-weight="700" fill="#0B1A2E" text-anchor="start" >Doctors: rating and fee had</text><text x="30.0" y="136.5" font-family="'Bricolage Grotesque',Arial,sans-serif" font-size="36" font-weight="700" fill="#0B1A2E" text-anchor="start" >the largest effects among the</text><text x="30.0" y="179.0" font-family="'Bricolage Grotesque',Arial,sans-serif" font-size="36" font-weight="700" fill="#0B1A2E" text-anchor="start" >levels tested</text><g transform="translate(0,209.0)"><text x="30.0" y="6.0" font-family="'Hanken Grotesk',Arial,sans-serif" font-size="19" font-weight="400" fill="#4A5A72" text-anchor="start" >Average change in selection probability relative to the</text><text x="30.0" y="32.6" font-family="'Hanken Grotesk',Arial,sans-serif" font-size="19" font-weight="400" fill="#4A5A72" text-anchor="start" >stated reference level, in percentage points. Bars:</text><text x="30.0" y="59.2" font-family="'Hanken Grotesk',Arial,sans-serif" font-size="19" font-weight="400" fill="#4A5A72" text-anchor="start" >estimate. Lines: published 95% confidence interval.</text><text x="30.0" y="85.8" font-family="'Hanken Grotesk',Arial,sans-serif" font-size="19" font-weight="400" fill="#4A5A72" text-anchor="start" >Selection explained in the note below.</text><text x="30.0" y="148.4" font-family="'Hanken Grotesk',Arial,sans-serif" font-size="22" font-weight="700" fill="#0B1A2E" text-anchor="start" >Rating 4.7 (vs 3.9)</text><text x="610.0" y="148.4" font-family="'Hanken Grotesk',Arial,sans-serif" font-size="22" font-weight="800" fill="#1F4FE0" text-anchor="end" >+31.38</text><line x1="30" x2="610" y1="176.39999999999998" y2="176.39999999999998" stroke="#ECE6D6" stroke-width="1"/><rect x="320.0" y="165.4" width="238.5" height="22" fill="#1F4FE0" rx="2"/><line x1="551.6" x2="565.4" y1="176.39999999999998" y2="176.39999999999998" stroke="#0B1A2E" stroke-width="2.4"/><line x1="551.6" x2="551.6" y1="169.39999999999998" y2="183.39999999999998" stroke="#0B1A2E" stroke-width="2.4"/><line x1="565.4" x2="565.4" y1="169.39999999999998" y2="183.39999999999998" stroke="#0B1A2E" stroke-width="2.4"/><text x="30.0" y="224.4" font-family="'Hanken Grotesk',Arial,sans-serif" font-size="22" font-weight="400" fill="#0B1A2E" text-anchor="start" >400 reviews (vs 12)</text><text x="610.0" y="224.4" font-family="'Hanken Grotesk',Arial,sans-serif" font-size="22" font-weight="600" fill="#0B1A2E" text-anchor="end" >+8.44</text><line x1="30" x2="610" y1="252.39999999999998" y2="252.39999999999998" stroke="#ECE6D6" stroke-width="1"/><rect x="320.0" y="241.4" width="64.1" height="22" fill="#C9C2B2" rx="2"/><line x1="377.5" x2="390.8" y1="252.39999999999998" y2="252.39999999999998" stroke="#0B1A2E" stroke-width="2.4"/><line x1="377.5" x2="377.5" y1="245.39999999999998" y2="259.4" stroke="#0B1A2E" stroke-width="2.4"/><line x1="390.8" x2="390.8" y1="245.39999999999998" y2="259.4" stroke="#0B1A2E" stroke-width="2.4"/><text x="30.0" y="300.4" font-family="'Hanken Grotesk',Arial,sans-serif" font-size="22" font-weight="400" fill="#0B1A2E" text-anchor="start" >Review 3 days old (vs 11 months)</text><text x="610.0" y="300.4" font-family="'Hanken Grotesk',Arial,sans-serif" font-size="22" font-weight="600" fill="#0B1A2E" text-anchor="end" >+3.80</text><line x1="30" x2="610" y1="328.4" y2="328.4" stroke="#ECE6D6" stroke-width="1"/><rect x="320.0" y="317.4" width="28.9" height="22" fill="#C9C2B2" rx="2"/><line x1="343.5" x2="354.3" y1="328.4" y2="328.4" stroke="#0B1A2E" stroke-width="2.4"/><line x1="343.5" x2="343.5" y1="321.4" y2="335.4" stroke="#0B1A2E" stroke-width="2.4"/><line x1="354.3" x2="354.3" y1="321.4" y2="335.4" stroke="#0B1A2E" stroke-width="2.4"/><text x="30.0" y="376.4" font-family="'Hanken Grotesk',Arial,sans-serif" font-size="22" font-weight="400" fill="#0B1A2E" text-anchor="start" >“Responds to patient feedback” note</text><text x="610.0" y="376.4" font-family="'Hanken Grotesk',Arial,sans-serif" font-size="22" font-weight="600" fill="#0B1A2E" text-anchor="end" >+2.09</text><line x1="30" x2="610" y1="404.4" y2="404.4" stroke="#ECE6D6" stroke-width="1"/><rect x="320.0" y="393.4" width="15.9" height="22" fill="#C9C2B2" rx="2"/><line x1="330.4" x2="341.3" y1="404.4" y2="404.4" stroke="#0B1A2E" stroke-width="2.4"/><line x1="330.4" x2="330.4" y1="397.4" y2="411.4" stroke="#0B1A2E" stroke-width="2.4"/><line x1="341.3" x2="341.3" y1="397.4" y2="411.4" stroke="#0B1A2E" stroke-width="2.4"/><text x="30.0" y="452.4" font-family="'Hanken Grotesk',Arial,sans-serif" font-size="22" font-weight="400" fill="#0B1A2E" text-anchor="start" >University-hospital affiliation</text><text x="610.0" y="452.4" font-family="'Hanken Grotesk',Arial,sans-serif" font-size="22" font-weight="600" fill="#0B1A2E" text-anchor="end" >+0.34</text><line x1="30" x2="610" y1="480.4" y2="480.4" stroke="#ECE6D6" stroke-width="1"/><rect x="320.0" y="469.4" width="2.6" height="22" fill="#C9C2B2" rx