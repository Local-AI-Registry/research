<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1460.3" width="640" height="1460.3" role="img" aria-labelledby="tm dm"><title id="tm">A working model, and what the studies can actually observe</title><desc id="dm">Conceptual figure by Local AI Registry. Top row: a working model with three steps, 1. Found (which businesses reach the assistant&#x27;s sources), 2. Evaluated (what it reads about each candidate) and 3. Chosen (which it names, and in what order). Bottom row: the four measures the studies in this brief used: presence in retrieved sources or results (rarely observed, e.g. a vendor preprint by Tannenbaum); mention in the final answer (Bali census of Canggu and Ubud; Ibrahim and Zaki); first position among names mentioned (Bali census); and picks from a set chosen by the researchers (three randomized experiments: hotels, doctors, products). The four measures are not equivalent.</desc><rect width="640" height="1460.3" fill="#FBF9F4"/><text x="30.0" y="48.0" font-family="'Bricolage Grotesque',Arial,sans-serif" font-size="19" font-weight="800" fill="#1F4FE0" text-anchor="start" letter-spacing="1.4">CONCEPTUAL FIGURE · LOCAL AI REGISTRY SYNTHESIS</text><text x="30.0" y="94.0" font-family="'Bricolage Grotesque',Arial,sans-serif" font-size="36" font-weight="700" fill="#0B1A2E" text-anchor="start" >A working model, and what the</text><text x="30.0" y="136.5" font-family="'Bricolage Grotesque',Arial,sans-serif" font-size="36" font-weight="700" fill="#0B1A2E" text-anchor="start" >studies can actually observe</text><g transform="translate(0,166.5)"><text x="30.0" y="6.0" font-family="'Hanken Grotesk',Arial,sans-serif" font-size="19" font-weight="400" fill="#4A5A72" text-anchor="start" >Top: a model for organizing the evidence, not a</text><text x="30.0" y="32.6" font-family="'Hanken Grotesk',Arial,sans-serif" font-size="19" font-weight="400" fill="#4A5A72" text-anchor="start" >description of how any assistant works inside.</text><rect x="30" y="67.19999999999999" width="580" height="104" rx="10" fill="#FBF9F4" stroke="#D8D2C3" stroke-width="1.5"/><text x="52.0" y="107.2" font-family="'Bricolage Grotesque',Arial,sans-serif" font-size="26" font-weight="700" fill="#0B1A2E" text-anchor="start" >1. Found</text><text x="52.0" y="145.2" font-family="'Hanken Grotesk',Arial,sans-serif" font-size="21" font-weight="400" fill="#0B1A2E" text-anchor="start" >Which businesses reach the assistant’s sources</text><line x1="320.0" y1="177.2" x2="320.0" y2="205.2" stroke="#C9C2B2" stroke-width="3"/><path d="M320.0,205.2 L315.2,195.3 L324.8,195.3 Z" fill="#C9C2B2"/><rect x="30" y="211.2" width="580" height="104" rx="10" fill="#FBF9F4" stroke="#D8D2C3" stroke-width="1.5"/><text x="52.0" y="251.2" font-family="'Bricolage Grotesque',Arial,sans-serif" font-size="26" font-weight="700" fill="#0B1A2E" text-anchor="start" >2. Evaluated</text><text x="52.0" y="289.2" font-family="'Hanken Grotesk',Arial,sans-serif" font-size="21" font-weight="400" fill="#0B1A2E" text-anchor="start" >What it reads about each candidate</text><line x1="320.0" y1="321.2" x2="320.0" y2="349.2" stroke="#C9C2B2" stroke-width="3"/><path d="M320.0,349.2 L315.2,339.3 L324.8,339.3 Z" fill="#C9C2B2"/><rect x="30" y="355.2" width="580" height="104" rx="10" fill="#FBF9F4" stroke="#D8D2C3" stroke-width="1.5"/><text x="52.0" y="395.2" font-family="'Bricolage Grotesque',Arial,sans-serif" font-size="26" font-weight="700" fill="#0B1A2E" text-anchor="start" >3. Chosen</text><text x="52.0" y="433.2" font-family="'Hanken Grotesk',Arial,sans-serif" font-size="21" font-weight="400" fill="#0B1A2E" text-anchor="start" >Which it names, and in what order</text><text x="30.0" y="505.2" font-family="'Bricolage Grotesque',Arial,sans-serif" font-size="21" font-weight="700" fill="#4A5A72" text-anchor="start" >What the studies in this brief actually measured</text><rect x="30" y="527.2" width="580" height="120" rx="10" fill="#F4F1EA" stroke="#C9C2B2" stroke-width="1.5" stroke-dasharray="7 6"/><text x="52.0" y="563.2" font-family="'Bricolage Grotesque',Arial,sans-serif" font-size="21" font-weight="700" fill="#0B1A2E" text-anchor="start" >Presence in retrieved sources or results</text><text x="52.0" y="595.2" font-family="'Hanken Grotesk',Arial,sans-serif" font-size="19" font-weight="400" fill="#4A5A72" text-anchor="start" >Observed only in a few studies, e.g. a vendor</text><text x="52.0" y="622.8" font-family="'Hanken Grotesk',Arial,sans-serif" font-size="19" font-weight="400" fill="#4A5A72" text-anchor="start" >preprint (Tannenbaum)</text><rect x="30" y="661.2" width="580" height="120" rx="10" fill="#FBF9F4" stroke="#D8D2C3" stroke-width="1.5"/><text x="52.0" y="697.2" font-family="'Bricolage Grotesque',Arial,sans-serif" font-size="21" font-weight="700" fill="#0B1A2E" text-anchor="start" >Mention in the final answer</text><text x="52.0" y="729.2" font-family="'Hanken Grotesk',Arial,sans-serif" font-size="19" font-weight="400" fill="#4A5A72" text-anchor="start" >Bali census (Canggu and Ubud); Ibrahim</text><text x="52.0" y="756.8" font-family="'Hanken Grotesk',Arial,sans-serif" font-size="19" font-weight="400" fill="#4A5A72" text-anchor="start" >and Zaki</text><rect x="30" y="795.2" width="580" height="92" rx="10" fill="#FBF9F4" stroke="#D8D2C3" stroke-width="1.5"/><text x="52.0" y="831.2" font-family="'Bricolage Grotesque',Arial,sans-serif" font-size="21" font-weight="700" fill="#0B1A2E" text-anchor="start" >First position among names mentioned</text><text x="52.0" y="863.2" font-family="'Hanken Grotesk',Arial,sans-serif" font-size="19" font-weight="400" fill="#4A5A72" text-anchor="start" >Bali census (Canggu and Ubud)</text><rect x="30" y="901.2" width="580" height="120" rx="10" fill="#E7EDFC" stroke="#1F4FE0" stroke-width="2"/><text x="52.0" y="937.2" font-family="'Bricolage Grotesque',Arial,sans-serif" font-size="21" font-weight="700" fill="#0B1A2E" text-anchor="start" >Pick from a set chosen by the researchers</text><text x="52.0" y="969.2" font-family="'Hanken Grotesk',Arial,sans-serif" font-size="19" font-weight="400" fill="#4A5A72" text-anchor="start" >Three randomized experiments: hotels,</text><text x="52.0" y="996.8" font-family="'Hanken Grotesk',Arial,sans-serif" font-size="19" font-weight="400" fill="#4A5A72" text-anchor="start" >doctors, products</text><text x="30.0" y="1057.2" font-family="'Hanken Grotesk',Arial,sans-serif" font-size="19" font-weight="400" fill="#4A5A72" text-anchor="start" >Conceptual figure: Local AI Registry synthesis. The four</text><text x="30.0" y="1083.8" font-family="'Hanken Grotesk',Arial,sans-serif" font-size="19" font-weight="400" fill="#4A5A72" text-anchor="start" >measures are not equivalent. Final-answer measures reflect</text><text x="30.0" y="1110.4" font-family="'Hanken Grotesk',Arial,sans-serif" font-size="19" font-weight="400" fill="#4A5A72" text-anchor="start" >all steps together and do not show an assistant’s internal</text><text x="30.0" y="1137.0" font-family="'Hanken Grotesk',Arial,sans-serif" font-size="19" font-weight="400" fill="#4A5A72" text-anchor="start" >candidate list. Similar splits appear in Pitenin (2026),</text><text x="30.0" y="1163.6" font-family="'Hanken Grotesk',Arial,sans-serif" font-size="19" font-weight="400" fill="#4A5A72" text-anchor="start" >Tannenbaum (2026) and, for human shoppers, Ursu (2018).</text><text x="30.0" y="1190.2" font-family="'Hanken Grotesk',Arial,sans-serif" font-size="19" font-weight="400" fill="#4A5A72" text-anchor="start" >Dashed box: rarely observed.</text></g><line x1="30" x2="610" y1="1389.3" y2="1389.3" stroke="#D8D2C3"/><text x="30.0" y="1408.3" font-family="'Hanken Grotesk',Arial,sans-serif" font-size="19" font-weight="400" fill="#4A5A72" text-anchor="start" >Not data: a conceptual figure made by Local AI Registry</text><text x="610.0" y="1442.3" font-family="'Hanken Grotesk',Arial,sans-serif" font-size="18" font-weight="700" fill="#1F4FE0" text-anchor="end" >Local AI Registry · localairegistry.com/research</text></svg>