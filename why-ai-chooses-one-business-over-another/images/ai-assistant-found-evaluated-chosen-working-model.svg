<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 697.0" width="1000" height="697.0" role="img" aria-labelledby="t d"><title id="t">A working model, and what the studies can actually observe</title><desc id="d">Conceptual figure by Local AI Registry. Top row: a working model with three steps, 1. Found (which businesses reach the assistant&#x27;s sources), 2. Evaluated (what it reads about each candidate) and 3. Chosen (which it names, and in what order). Bottom row: the four measures the studies in this brief used: presence in retrieved sources or results (rarely observed, e.g. a vendor preprint by Tannenbaum); mention in the final answer (Bali census of Canggu and Ubud; Ibrahim and Zaki); first position among names mentioned (Bali census); and picks from a set chosen by the researchers (three randomized experiments: hotels, doctors, products). The four measures are not equivalent.</desc><rect width="1000" height="697.0" fill="#FBF9F4"/><text x="40.0" y="46.0" font-family="'Bricolage Grotesque',Arial,sans-serif" font-size="15" font-weight="800" fill="#1F4FE0" text-anchor="start" letter-spacing="1.6">CONCEPTUAL FIGURE · LOCAL AI REGISTRY SYNTHESIS</text><text x="40.0" y="90.0" font-family="'Bricolage Grotesque',Arial,sans-serif" font-size="30" font-weight="700" fill="#0B1A2E" text-anchor="start" >A working model, and what the studies can actually observe</text><g transform="translate(0,116)"><text x="40.0" y="6.0" font-family="'Hanken Grotesk',Arial,sans-serif" font-size="17" font-weight="400" fill="#4A5A72" text-anchor="start" >Top: a model for organizing the evidence, not a description of how any assistant works inside.</text><rect x="40" y="30" width="268" height="130" rx="10" fill="#FBF9F4" stroke="#D8D2C3" stroke-width="1.5"/><text x="62.0" y="72.0" font-family="'Bricolage Grotesque',Arial,sans-serif" font-size="24" font-weight="700" fill="#0B1A2E" text-anchor="start" >1. Found</text><text x="62.0" y="108.0" font-family="'Hanken Grotesk',Arial,sans-serif" font-size="18" font-weight="400" fill="#0B1A2E" text-anchor="start" >Which businesses reach the</text><text x="62.0" y="132.3" font-family="'Hanken Grotesk',Arial,sans-serif" font-size="18" font-weight="400" fill="#0B1A2E" text-anchor="start" >assistant’s sources</text><line x1="316" y1="95" x2="358" y2="95" stroke="#C9C2B2" stroke-width="3"/><path d="M358,95 L348.1,99.8 L348.1,90.2 Z" fill="#C9C2B2"/><rect x="366" y="30" width="268" height="130" rx="10" fill="#FBF9F4" stroke="#D8D2C3" stroke-width="1.5"/><text x="388.0" y="72.0" font-family="'Bricolage Grotesque',Arial,sans-serif" font-size="24" font-weight="700" fill="#0B1A2E" text-anchor="start" >2. Evaluated</text><text x="388.0" y="108.0" font-family="'Hanken Grotesk',Arial,sans-serif" font-size="18" font-weight="400" fill="#0B1A2E" text-anchor="start" >What it reads about</text><text x="388.0" y="132.3" font-family="'Hanken Grotesk',Arial,sans-serif" font-size="18" font-weight="400" fill="#0B1A2E" text-anchor="start" >each candidate</text><line x1="642" y1="95" x2="684" y2="95" stroke="#C9C2B2" stroke-width="3"/><path d="M684,95 L674.1,99.8 L674.1,90.2 Z" fill="#C9C2B2"/><rect x="692" y="30" width="268" height="130" rx="10" fill="#FBF9F4" stroke="#D8D2C3" stroke-width="1.5"/><text x="714.0" y="72.0" font-family="'Bricolage Grotesque',Arial,sans-serif" font-size="24" font-weight="700" fill="#0B1A2E" text-anchor="start" >3. Chosen</text><text x="714.0" y="108.0" font-family="'Hanken Grotesk',Arial,sans-serif" font-size="18" font-weight="400" fill="#0B1A2E" text-anchor="start" >Which it names, and in</text><text x="714.0" y="132.3" font-family="'Hanken Grotesk',Arial,sans-serif" font-size="18" font-weight="400" fill="#0B1A2E" text-anchor="start" >what order</text><text x="40.0" y="206.0" font-family="'Bricolage Grotesque',Arial,sans-serif" font-size="18" font-weight="700" fill="#4A5A72" text-anchor="start" >What the studies in this brief actually measured</text><rect x="40" y="226" width="214" height="196" rx="10" fill="#F4F1EA" stroke="#C9C2B2" stroke-width="1.5" stroke-dasharray="7 6"/><text x="58.0" y="260.0" font-family="'Bricolage Grotesque',Arial,sans-serif" font-size="18" font-weight="700" fill="#0B1A2E" text-anchor="start" >Presence in retrieved</text><text x="58.0" y="283.4" font-family="'Bricolage Grotesque',Arial,sans-serif" font-size="18" font-weight="700" fill="#0B1A2E" text-anchor="start" >sources or results</text><text x="58.0" y="324.8" font-family="'Hanken Grotesk',Arial,sans-serif" font-size="15.5" font-weight="400" fill="#4A5A72" text-anchor="start" >Observed only in a few</text><text x="58.0" y="346.5" font-family="'Hanken Grotesk',Arial,sans-serif" font-size="15.5" font-weight="400" fill="#4A5A72" text-anchor="start" >studies, e.g. a vendor</text><text x="58.0" y="368.2" font-family="'Hanken Grotesk',Arial,sans-serif" font-size="15.5" font-weight="400" fill="#4A5A72" text-anchor="start" >preprint (Tannenbaum)</text><rect x="268" y="226" width="214" height="196" rx="10" fill="#FBF9F4" stroke="#D8D2C3" stroke-width="1.5"/><text x="286.0" y="260.0" font-family="'Bricolage Grotesque',Arial,sans-serif" font-size="18" font-weight="700" fill="#0B1A2E" text-anchor="start" >Mention in the</text><text x="286.0" y="283.4" font-family="'Bricolage Grotesque',Arial,sans-serif" font-size="18" font-weight="700" fill="#0B1A2E" text-anchor="start" >final answer</text><text x="286.0" y="324.8" font-family="'Hanken Grotesk',Arial,sans-serif" font-size="15.5" font-weight="400" fill="#4A5A72" text-anchor="start" >Bali census (Canggu and</text><text x="286.0" y="346.5" font-family="'Hanken Grotesk',Arial,sans-serif" font-size="15.5" font-weight="400" fill="#4A5A72" text-anchor="start" >Ubud); Ibrahim and Zaki</text><rect x="496" y="226" width="214" height="196" rx="10" fill="#FBF9F4" stroke="#D8D2C3" stroke-width="1.5"/><text x="514.0" y="260.0" font-family="'Bricolage Grotesque',Arial,sans-serif" font-size="18" font-weight="700" fill="#0B1A2E" text-anchor="start" >First position among</text><text x="514.0" y="283.4" font-family="'Bricolage Grotesque',Arial,sans-serif" font-size="18" font-weight="700" fill="#0B1A2E" text-anchor="start" >names mentioned</text><text x="514.0" y="324.8" font-family="'Hanken Grotesk',Arial,sans-serif" font-size="15.5" font-weight="400" fill="#4A5A72" text-anchor="start" >Bali census (Canggu</text><text x="514.0" y="346.5" font-family="'Hanken Grotesk',Arial,sans-serif" font-size="15.5" font-weight="400" fill="#4A5A72" text-anchor="start" >and Ubud)</text><rect x="724" y="226" width="214" height="196" rx="10" fill="#E7EDFC" stroke="#1F4FE0" stroke-width="2"/><text x="742.0" y="260.0" font-family="'Bricolage Grotesque',Arial,sans-serif" font-size="18" font-weight="700" fill="#0B1A2E" text-anchor="start" >Pick from a set</text><text x="742.0" y="283.4" font-family="'Bricolage Grotesque',Arial,sans-serif" font-size="18" font-weight="700" fill="#0B1A2E" text-anchor="start" >chosen by</text><text x="742.0" y="306.8" font-family="'Bricolage Grotesque',Arial,sans-serif" font-size="18" font-weight="700" fill="#0B1A2E" text-anchor="start" >the researchers</text><text x="742.0" y="348.2" font-family="'Hanken Grotesk',Arial,sans-serif" font-size="15.5" font-weight="400" fill="#4A5A72" text-anchor="start" >Three randomized</text><text x="742.0" y="369.9" font-family="'Hanken Grotesk',Arial,sans-serif" font-size="15.5" font-weight="400" fill="#4A5A72" text-anchor="start" >experiments: hotels,</text><text x="742.0" y="391.6" font-family="'Hanken Grotesk',Arial,sans-serif" font-size="15.5" font-weight="400" fill="#4A5A72" text-anchor="start" >doctors, products</text><text x="40.0" y="458.0" font-family="'Hanken Grotesk',Arial,sans-serif" font-size="15" font-weight="400" fill="#4A5A72" text-anchor="start" >Conceptual figure: Local AI Registry synthesis. The four measures are not equivalent. Final-answer measures reflect</text><text x="40.0" y="479.0" font-family="'Hanken Grotesk',Arial,sans-serif" font-size="15" font-weight="400" fill="#4A5A72" text-anchor="start" >all steps together and do not show an assistant’s internal candidate list. Similar splits appear in Pitenin (2026),</text><text x="40.0" y="500.0" font-family="'Hanken Grotesk',Arial,sans-serif" font-size="15" font-weight="400" fill="#4A5A72" text-anchor="start" >Tannenbaum (2026) and, for human shoppers, Ursu (2018). Dashed box: rarely observed.</text></g><line x1="40" x2="960" y1="631.0" y2="631.0" stroke="#D8D2C3"/><text x="40.0" y="657.0" font-family="'Hanken Grotesk',Arial,sans-serif" font-size="15" font-weight="400" fill="#4A5A72" text-anchor="start" >Not data: a conceptual figure made by Local AI Registry</text><text x="960.0" y="681.0" font-family="'Hanken Grotesk',Arial,sans-serif" font-size="15" font-weight="700" fill="#1F4FE0" text-anchor="end" >Local AI Registry · localairegistry.com/research</text></svg>