<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1530.4" width="640" height="1530.4" role="img" aria-labelledby="tm dm"><title id="tm">What owners can influence is only partly what has been tested</title><desc id="dm">Conceptual 2x2 figure by Local AI Registry. Columns: mostly outside your control, and you can influence. Rows: tested in the choice experiments, and not tested in these experiments. Tested and influenceable (strongest evidence, choice step only): star rating, review volume and recency, prices shown, certifications (eco label, hotels only), a note that you reply to reviews. Tested but outside your control: list position, AI model and version, chain or independent status, names shown on a profile. Not tested and outside your control: whether the assistant searches the web, which sources it retrieves, how the customer words the question, where the customer asks from. Not tested but influenceable: what replies say, facts that match across sources, own website, listed prices and web mentions (linked to final-answer mentions in two Bali markets), local badges, awards and best-of lists.</desc><rect width="640" height="1530.4" fill="#FBF9F4"/><text x="30.0" y="48.0" font-family="'Bricolage Grotesque',Arial,sans-serif" font-size="19" font-weight="800" fill="#1F4FE0" text-anchor="start" letter-spacing="1.4">CONCEPTUAL FIGURE · LOCAL AI REGISTRY SYNTHESIS</text><text x="30.0" y="94.0" font-family="'Bricolage Grotesque',Arial,sans-serif" font-size="36" font-weight="700" fill="#0B1A2E" text-anchor="start" >What owners can influence is</text><text x="30.0" y="136.5" font-family="'Bricolage Grotesque',Arial,sans-serif" font-size="36" font-weight="700" fill="#0B1A2E" text-anchor="start" >only partly what has</text><text x="30.0" y="179.0" font-family="'Bricolage Grotesque',Arial,sans-serif" font-size="36" font-weight="700" fill="#0B1A2E" text-anchor="start" >been tested</text><g transform="translate(0,209.0)"><rect x="30" y="0" width="580" height="240" rx="10" fill="#FBF9F4" stroke="#D8D2C3" stroke-width="1.5"/><text x="52.0" y="34.0" font-family="'Bricolage Grotesque',Arial,sans-serif" font-size="21" font-weight="700" fill="#0B1A2E" text-anchor="start" >Mostly outside your control</text><text x="52.0" y="62.0" font-family="'Hanken Grotesk',Arial,sans-serif" font-size="19" font-weight="600" fill="#4A5A72" text-anchor="start" >Tested in the choice experiments</text><text x="52.0" y="104.0" font-family="'Hanken Grotesk',Arial,sans-serif" font-size="21" font-weight="400" fill="#0B1A2E" text-anchor="start" >Where you appear in the list</text><text x="52.0" y="140.0" font-family="'Hanken Grotesk',Arial,sans-serif" font-size="21" font-weight="400" fill="#0B1A2E" text-anchor="start" >Which AI model and version is used</text><text x="52.0" y="176.0" font-family="'Hanken Grotesk',Arial,sans-serif" font-size="21" font-weight="400" fill="#0B1A2E" text-anchor="start" >Chain or independent status</text><text x="52.0" y="212.0" font-family="'Hanken Grotesk',Arial,sans-serif" font-size="21" font-weight="400" fill="#0B1A2E" text-anchor="start" >Names shown on a profile</text><rect x="30" y="254" width="580" height="308" rx="10" fill="#E7EDFC" stroke="#1F4FE0" stroke-width="2"/><text x="52.0" y="288.0" font-family="'Bricolage Grotesque',Arial,sans-serif" font-size="21" font-weight="700" fill="#0B1A2E" text-anchor="start" >You can influence</text><text x="52.0" y="316.0" font-family="'Hanken Grotesk',Arial,sans-serif" font-size="19" font-weight="600" fill="#4A5A72" text-anchor="start" >Tested in the choice experiments</text><text x="52.0" y="358.0" font-family="'Hanken Grotesk',Arial,sans-serif" font-size="21" font-weight="400" fill="#0B1A2E" text-anchor="start" >Star rating, through service and real reviews</text><text x="52.0" y="394.0" font-family="'Hanken Grotesk',Arial,sans-serif" font-size="21" font-weight="400" fill="#0B1A2E" text-anchor="start" >Review volume and recency</text><text x="52.0" y="430.0" font-family="'Hanken Grotesk',Arial,sans-serif" font-size="21" font-weight="400" fill="#0B1A2E" text-anchor="start" >Prices shown</text><text x="52.0" y="466.0" font-family="'Hanken Grotesk',Arial,sans-serif" font-size="21" font-weight="400" fill="#0B1A2E" text-anchor="start" >Certifications (eco label, hotels only)</text><text x="52.0" y="502.0" font-family="'Hanken Grotesk',Arial,sans-serif" font-size="21" font-weight="400" fill="#0B1A2E" text-anchor="start" >A note that you reply to reviews</text><text x="52.0" y="544.0" font-family="'Bricolage Grotesque',Arial,sans-serif" font-size="21" font-weight="700" fill="#1F4FE0" text-anchor="start" >Strongest evidence, choice step only</text><rect x="30" y="576" width="580" height="240" rx="10" fill="#F4F1EA" stroke="#C9C2B2" stroke-width="1.5" stroke-dasharray="7 6"/><text x="52.0" y="610.0" font-family="'Bricolage Grotesque',Arial,sans-serif" font-size="21" font-weight="700" fill="#0B1A2E" text-anchor="start" >Mostly outside your control</text><text x="52.0" y="638.0" font-family="'Hanken Grotesk',Arial,sans-serif" font-size="19" font-weight="600" fill="#4A5A72" text-anchor="start" >Not tested in these experiments</text><text x="52.0" y="680.0" font-family="'Hanken Grotesk',Arial,sans-serif" font-size="21" font-weight="400" fill="#0B1A2E" text-anchor="start" >Whether the assistant searches the web</text><text x="52.0" y="716.0" font-family="'Hanken Grotesk',Arial,sans-serif" font-size="21" font-weight="400" fill="#0B1A2E" text-anchor="start" >Which sources it retrieves</text><text x="52.0" y="752.0" font-family="'Hanken Grotesk',Arial,sans-serif" font-size="21" font-weight="400" fill="#0B1A2E" text-anchor="start" >How the customer words the question</text><text x="52.0" y="788.0" font-family="'Hanken Grotesk',Arial,sans-serif" font-size="21" font-weight="400" fill="#0B1A2E" text-anchor="start" >Where the customer is asking from</text><rect x="30" y="830" width="580" height="272" rx="10" fill="#F4F1EA" stroke="#C9C2B2" stroke-width="1.5" stroke-dasharray="7 6"/><text x="52.0" y="864.0" font-family="'Bricolage Grotesque',Arial,sans-serif" font-size="21" font-weight="700" fill="#0B1A2E" text-anchor="start" >You can influence</text><text x="52.0" y="892.0" font-family="'Hanken Grotesk',Arial,sans-serif" font-size="19" font-weight="600" fill="#4A5A72" text-anchor="start" >Not tested in these experiments</text><text x="52.0" y="934.0" font-family="'Hanken Grotesk',Arial,sans-serif" font-size="21" font-weight="400" fill="#0B1A2E" text-anchor="start" >What your replies to reviews say</text><text x="52.0" y="970.0" font-family="'Hanken Grotesk',Arial,sans-serif" font-size="21" font-weight="400" fill="#0B1A2E" text-anchor="start" >Facts that match across sources</text><text x="52.0" y="1006.0" font-family="'Hanken Grotesk',Arial,sans-serif" font-size="21" font-weight="400" fill="#0B1A2E" text-anchor="start" >Own website, listed prices, web mentions</text><text x="52.0" y="1034.0" font-family="'Hanken Grotesk',Arial,sans-serif" font-size="17.5" font-weight="400" fill="#4A5A72" text-anchor="start" >(linked to final-answer mentions in two Bali markets)</text><text x="52.0" y="1072.0" font-family="'Hanken Grotesk',Arial,sans-serif" font-size="21" font-weight="400" fill="#0B1A2E" text-anchor="start" >Local badges, awards and best-of lists</text><text x="30.0" y="1138.0" font-family="'Hanken Grotesk',Arial,sans-serif" font-size="19" font-weight="400" fill="#4A5A72" text-anchor="start" >Conceptual figure: Local AI Registry synthesis of the</text><text x="30.0" y="1164.6" font-family="'Hanken Grotesk',Arial,sans-serif" font-size="19" font-weight="400" fill="#4A5A72" text-anchor="start" >studies in this brief. Placement shows what was tested,</text><text x="30.0" y="1191.2" font-family="'Hanken Grotesk',Arial,sans-serif" font-size="19" font-weight="400" fill="#4A5A72" text-anchor="start" >not how large an effect is. Dashed boxes: not tested in</text><text x="30.0" y="1217.8" font-family="'Hanken Grotesk',Arial,sans-serif" font-size="19" font-weight="400" fill="#4A5A72" text-anchor="start" >the controlled choice experiments reviewed here.</text></g><line x1="30" x2="610" y1="1459.4" y2="1459.4" stroke="#D8D2C3"/><text x="30.0" y="1478.4" font-family="'Hanken Grotesk',Arial,sans-serif" font-size="19" font-weight="400" fill="#4A5A72" text-anchor="start" >Not data: a conceptual figure made by Local AI Registry</text><text x="610.0" y="1512.4" font-family="'Hanken Grotesk',Arial,sans-serif" font-size="18" font-weight="700" fill="#1F4FE0" text-anchor="end" >Local AI Registry · localairegistry.com/research</text></svg>