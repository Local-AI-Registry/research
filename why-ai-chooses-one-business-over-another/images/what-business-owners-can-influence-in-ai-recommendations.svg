<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 947.0" width="1000" height="947.0" role="img" aria-labelledby="t d"><title id="t">What owners can influence is only partly what has been tested</title><desc id="d">Conceptual 2x2 figure by Local AI Registry. Columns: mostly outside your control, and you can influence. Rows: tested in the choice experiments, and not tested in these experiments. Tested and influenceable (strongest evidence, choice step only): star rating, review volume and recency, prices shown, certifications (eco label, hotels only), a note that you reply to reviews. Tested but outside your control: list position, AI model and version, chain or independent status, names shown on a profile. Not tested and outside your control: whether the assistant searches the web, which sources it retrieves, how the customer words the question, where the customer asks from. Not tested but influenceable: what replies say, facts that match across sources, own website, listed prices and web mentions (linked to final-answer mentions in two Bali markets), local badges, awards and best-of lists.</desc><rect width="1000" height="947.0" fill="#FBF9F4"/><text x="40.0" y="46.0" font-family="'Bricolage Grotesque',Arial,sans-serif" font-size="15" font-weight="800" fill="#1F4FE0" text-anchor="start" letter-spacing="1.6">CONCEPTUAL FIGURE · LOCAL AI REGISTRY SYNTHESIS</text><text x="40.0" y="90.0" font-family="'Bricolage Grotesque',Arial,sans-serif" font-size="30" font-weight="700" fill="#0B1A2E" text-anchor="start" >What owners can influence is only partly what has</text><text x="40.0" y="125.4" font-family="'Bricolage Grotesque',Arial,sans-serif" font-size="30" font-weight="700" fill="#0B1A2E" text-anchor="start" >been tested</text><g transform="translate(0,151)"><text x="368.0" y="18.0" font-family="'Bricolage Grotesque',Arial,sans-serif" font-size="18.5" font-weight="700" fill="#4A5A72" text-anchor="middle" >Mostly outside your control</text><text x="766.0" y="18.0" font-family="'Bricolage Grotesque',Arial,sans-serif" font-size="18.5" font-weight="700" fill="#4A5A72" text-anchor="middle" >You can influence</text><text x="40.0" y="168.0" font-family="'Bricolage Grotesque',Arial,sans-serif" font-size="18.5" font-weight="700" fill="#4A5A72" text-anchor="start" >Tested in</text><text x="40.0" y="193.0" font-family="'Bricolage Grotesque',Arial,sans-serif" font-size="18.5" font-weight="700" fill="#4A5A72" text-anchor="start" >the choice</text><text x="40.0" y="217.9" font-family="'Bricolage Grotesque',Arial,sans-serif" font-size="18.5" font-weight="700" fill="#4A5A72" text-anchor="start" >experiments</text><rect x="176" y="40" width="384" height="300" rx="10" fill="#FBF9F4" stroke="#D8D2C3" stroke-width="1.5"/><text x="198.0" y="82.0" font-family="'Hanken Grotesk',Arial,sans-serif" font-size="17.5" font-weight="400" fill="#0B1A2E" text-anchor="start" >Where you appear in the list</text><text x="198.0" y="115.0" font-family="'Hanken Grotesk',Arial,sans-serif" font-size="17.5" font-weight="400" fill="#0B1A2E" text-anchor="start" >Which AI model and version is used</text><text x="198.0" y="148.0" font-family="'Hanken Grotesk',Arial,sans-serif" font-size="17.5" font-weight="400" fill="#0B1A2E" text-anchor="start" >Chain or independent status</text><text x="198.0" y="181.0" font-family="'Hanken Grotesk',Arial,sans-serif" font-size="17.5" font-weight="400" fill="#0B1A2E" text-anchor="start" >Names shown on a profile</text><rect x="574" y="40" width="384" height="300" rx="10" fill="#E7EDFC" stroke="#1F4FE0" stroke-width="2"/><text x="596.0" y="82.0" font-family="'Hanken Grotesk',Arial,sans-serif" font-size="17.5" font-weight="400" fill="#0B1A2E" text-anchor="start" >Star rating, through service and</text><text x="596.0" y="104.8" font-family="'Hanken Grotesk',Arial,sans-serif" font-size="17.5" font-weight="400" fill="#0B1A2E" text-anchor="start" >real reviews</text><text x="596.0" y="138.0" font-family="'Hanken Grotesk',Arial,sans-serif" font-size="17.5" font-weight="400" fill="#0B1A2E" text-anchor="start" >Review volume and recency</text><text x="596.0" y="171.0" font-family="'Hanken Grotesk',Arial,sans-serif" font-size="17.5" font-weight="400" fill="#0B1A2E" text-anchor="start" >Prices shown</text><text x="596.0" y="204.0" font-family="'Hanken Grotesk',Arial,sans-serif" font-size="17.5" font-weight="400" fill="#0B1A2E" text-anchor="start" >Certifications (eco label,</text><text x="596.0" y="226.8" font-family="'Hanken Grotesk',Arial,sans-serif" font-size="17.5" font-weight="400" fill="#0B1A2E" text-anchor="start" >hotels only)</text><text x="596.0" y="260.0" font-family="'Hanken Grotesk',Arial,sans-serif" font-size="17.5" font-weight="400" fill="#0B1A2E" text-anchor="start" >A note that you reply to reviews</text><text x="596.0" y="301.0" font-family="'Bricolage Grotesque',Arial,sans-serif" font-size="18" font-weight="700" fill="#1F4FE0" text-anchor="start" >Strongest evidence, choice step only</text><text x="40.0" y="482.0" font-family="'Bricolage Grotesque',Arial,sans-serif" font-size="18.5" font-weight="700" fill="#4A5A72" text-anchor="start" >Not tested</text><text x="40.0" y="507.0" font-family="'Bricolage Grotesque',Arial,sans-serif" font-size="18.5" font-weight="700" fill="#4A5A72" text-anchor="start" >in these</text><text x="40.0" y="532.0" font-family="'Bricolage Grotesque',Arial,sans-serif" font-size="18.5" font-weight="700" fill="#4A5A72" text-anchor="start" >experiments</text><rect x="176" y="354" width="384" height="300" rx="10" fill="#F4F1EA" stroke="#C9C2B2" stroke-width="1.5" stroke-dasharray="7 6"/><text x="198.0" y="396.0" font-family="'Hanken Grotesk',Arial,sans-serif" font-size="17.5" font-weight="400" fill="#0B1A2E" text-anchor="start" >Whether the assistant searches</text><text x="198.0" y="418.8" font-family="'Hanken Grotesk',Arial,sans-serif" font-size="17.5" font-weight="400" fill="#0B1A2E" text-anchor="start" >the web</text><text x="198.0" y="452.0" font-family="'Hanken Grotesk',Arial,sans-serif" font-size="17.5" font-weight="400" fill="#0B1A2E" text-anchor="start" >Which sources it retrieves</text><text x="198.0" y="485.0" font-family="'Hanken Grotesk',Arial,sans-serif" font-size="17.5" font-weight="400" fill="#0B1A2E" text-anchor="start" >How the customer words the question</text><text x="198.0" y="518.0" font-family="'Hanken Grotesk',Arial,sans-serif" font-size="17.5" font-weight="400" fill="#0B1A2E" text-anchor="start" >Where the customer is asking from</text><rect x="574" y="354" width="384" height="300" rx="10" fill="#F4F1EA" stroke="#C9C2B2" stroke-width="1.5" stroke-dasharray="7 6"/><text x="596.0" y="396.0" font-family="'Hanken Grotesk',Arial,sans-serif" font-size="17.5" font-weight="400" fill="#0B1A2E" text-anchor="start" >What your replies to reviews say</text><text x="596.0" y="429.0" font-family="'Hanken Grotesk',Arial,sans-serif" font-size="17.5" font-weight="400" fill="#0B1A2E" text-anchor="start" >Facts that match across sources</text><text x="596.0" y="462.0" font-family="'Hanken Grotesk',Arial,sans-serif" font-size="17.5" font-weight="400" fill="#0B1A2E" text-anchor="start" >Own website, listed prices,</text><text x="596.0" y="484.8" font-family="'Hanken Grotesk',Arial,sans-serif" font-size="17.5" font-weight="400" fill="#0B1A2E" text-anchor="start" >web mentions</text><text x="596.0" y="508.0" font-family="'Hanken Grotesk',Arial,sans-serif" font-size="14.5" font-weight="400" fill="#4A5A72" text-anchor="start" >(linked to final-answer mentions in two</text><text x="596.0" y="526.9" font-family="'Hanken Grotesk',Arial,sans-serif" font-size="14.5" font-weight="400" fill="#4A5A72" text-anchor="start" >Bali markets)</text><text x="596.0" y="562.0" font-family="'Hanken Grotesk',Arial,sans-serif" font-size="17.5" font-weight="400" fill="#0B1A2E" text-anchor="start" >Local badges, awards and</text><text x="596.0" y="584.8" font-family="'Hanken Grotesk',Arial,sans-serif" font-size="17.5" font-weight="400" fill="#0B1A2E" text-anchor="start" >best-of lists</text><text x="40.0" y="694.0" font-family="'Hanken Grotesk',Arial,sans-serif" font-size="15" font-weight="400" fill="#4A5A72" text-anchor="start" >Conceptual figure: Local AI Registry synthesis of the studies in this brief. Placement shows what was tested, not how</text><text x="40.0" y="715.0" font-family="'Hanken Grotesk',Arial,sans-serif" font-size="15" font-weight="400" fill="#4A5A72" text-anchor="start" >large an effect is. Dashed boxes: not tested in the controlled choice experiments reviewed here.</text></g><line x1="40" x2="960" y1="881.0" y2="881.0" stroke="#D8D2C3"/><text x="40.0" y="907.0" font-family="'Hanken Grotesk',Arial,sans-serif" font-size="15" font-weight="400" fill="#4A5A72" text-anchor="start" >Not data: a conceptual figure made by Local AI Registry</text><text x="960.0" y="931.0" font-family="'Hanken Grotesk',Arial,sans-serif" font-size="15" font-weight="700" fill="#1F4FE0" text-anchor="end" >Local AI Registry · localairegistry.com/research</text></svg>